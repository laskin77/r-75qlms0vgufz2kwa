<h1 id="title">Roby 月報</h1><div class="sub" id="range"></div>
<div class="sample" id="sample">⚠️ 範例資料（版面預覽用，非真實紀錄）</div>
<div class="card"><h2>本月總覽</h2><div class="kpi">
<div>讀書計畫完成率<b id="planRate"></b><small id="planCnt"></small></div>
<div>聯絡簿<b id="cb"></b></div><div>英文大師<b id="eng"></b></div><div>專注總時數<b id="focusTot"></b></div></div></div>
<div class="card"><h2>各週讀書計畫完成率</h2><div id="weeks"></div></div>

<!-- ===== 資料區：排程每月填入這段 JSON（sample:true 會顯示「範例資料」標示）===== -->
<script id="data" type="application/json">
{
 "sample": true,
 "year": 2026, "month": 10,
 "plan": {"done": 68, "total": 85},
 "weeks": [
  {"label": "第 1 週（10/1–10/4）", "done": 9, "total": 12},
  {"label": "第 2 週（10/5–10/11）", "done": 17, "total": 21},
  {"label": "第 3 週（10/12–10/18）", "done": 19, "total": 21},
  {"label": "第 4 週（10/19–10/25）", "done": 15, "total": 21},
  {"label": "第 5 週（10/26–10/31）", "done": 8, "total": 10}
 ],
 "daily": {"days": 31, "contact": 28, "english": 24},
 "homework": [
  {"name": "寰宇數學回家功課", "ontime": 4, "late": 0},
  {"name": "廖柏坤理化每週功課", "ontime": 3, "late": 1},
  {"name": "國文家教功課", "ontime": 4, "late": 0},
  {"name": "ADA 英文家教功課", "ontime": 2, "late": 2}
 ],
 "focusMinutes": {"數學": 540, "理化": 610, "國文": 300, "英文": 420, "社會": 180},
 "notes": [
  {"subject": "國文", "count": 2, "points": 6},
  {"subject": "理化", "count": 3, "points": 9},
  {"subject": "社會", "count": 1, "points": 1}
 ],
 "pointsTotal": 42,
 "highlights": ["（範例）理化連續三週準時完成", "（範例）第 3 週讀書計畫完成率 90%"],
 "advice": ["（範例）ADA 英文功課提早一天開始", "（範例）英文大師每天固定睡前做"]
}
</script>
<script>
(function(){var D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
var now=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'})),Y=D.year||now.getFullYear(),M=D.month||now.getMonth()+1,last=new Date(Y,M,0).getDate();
$('title').textContent='Roby 月報　'+Y+' 年 '+M+' 月';$('range').textContent=M+'/1 ～ '+M+'/'+last;document.title='Roby 月報 '+Y+'/'+M;
if(!D.sample)$('sample').remove();
var pct=(a,b)=>b?Math.round(a/b*100):0,esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('planRate').textContent=pct(D.plan.done,D.plan.total)+'%';$('planCnt').textContent=D.plan.done+' / '+D.plan.total+' 項';
var dd=D.daily.days||last;$('cb').textContent=D.daily.contact+' / '+dd+' 天';$('eng').textContent=D.daily.english+' / '+dd+' 天';
var bar=(l,v,max,txt,cls)=>'<div class="br"><span>'+esc(l)+'</span><div class="bar '+(cls||'')+'"><div style="width:'+pct(v,max)+'%"></div></div><span>'+txt+'</span></div>';
$('weeks').innerHTML=D.weeks.map(w=>bar(w.label.replace(/（.*/,''),w.done,w.total,pct(w.done,w.total)+'%（'+w.done+'/'+w.total+'）')).join('');
$('hw').innerHTML=D.homework.map(h=>'<tr><td>'+esc(h.name)+'</td><td class="ok">'+h.ontime+'</td><td class="no">'+h.late+'</td><td>'+pct(h.ontime,h.ontime+h.late)+'%</td></tr>').join('');
var fm=D.focusMinutes,tot=Object.values(fm).reduce((a,b)=>a+b,0),mx=Math.max(...Object.values(fm),1),hm=m=>Math.floor(m/60)+' 小時 '+(m%60)+' 分';
$('focusTot').textContent=(tot/60).toFixed(1)+' 小時';$('focus').innerHTML=Object.entries(fm).map(([k,v])=>bar(k,v,mx,hm(v),'w')).join('');
$('notes').innerHTML=D.notes.map(n=>'<tr><td>'+esc(n.subject)+'</td><td>'+n.count+'</td><td>'+n.points+'</td></tr>').join('');
$('ptsMonth').textContent=D.notes.reduce((a,n)=>a+n.points,0);$('ptsTotal').textContent=D.pointsTotal;
$('hl').innerHTML=D.highlights.map(s=>'<li>'+esc(s)+'</li>').join('');$('adv').innerHTML=D.advice.map(s=>'<li>'+esc(s)+'</li>').join('');
})();
</script>
