 <div class="back"><a href="../index.html#check">← 回今日檢查</a><a href="../index.html#chinese">← 回國文</a></div><h1>八上二段國文複習</h1>
 <p class="lead">翰林版　愛蓮說、鳥、生命中的碎珠　11/4–11/25 共 22 天計畫：每天約 40 題（形音義 23＋改錯 5 段＋閱讀 12）（形音義＋3 段改錯＋閱讀），答錯的題目自動收進「錯題本」</p>
 <div class="tabs"><button data-t="today" class="on">今日題目</button><button data-t="wrong" id="toWb">錯題本（App）<span class="badge" id="wbBadge">0</span></button><button data-t="log">紀錄／總表</button></div>

<script>
(function(){
var EMB=/[?&]embed=1/.test(location.search);if(EMB)document.documentElement.classList.add('emb');
var K={prog:'roby-cr-progress',days:'roby-cr-days',wrong:'roby-wrongbook',weak:'roby-cr-weak',plan:'roby-cr-plan'};
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){localStorage.setItem(k,JSON.stringify(v))}};
var DATA=window.CR_DATA||{questions:[]},QS=DATA.questions,BY={};QS.forEach(function(q){BY[q.id]=q});
var PLAN=[['形音義選擇題',['形音義','注音'],8],['改錯（整段）',['改錯'],3],['閱讀理解與課文深究',['閱讀'],12]];
var LESSONS=['愛蓮說','鳥','生命中的碎歌','段考範圍綜合','課外閱讀'],TOPICS=['形音義','注音','改錯','閱讀'];
var TCOL={'形音義':'#6b7f4e','注音':'#b5835a','改錯':'#c0675a','閱讀':'#5b7fa0'},LCOL={'愛蓮說':'#d48aa0','鳥':'#6b9a7a','生命中的碎歌':'#c9a24d','段考範圍綜合':'#9a8a7a','課外閱讀':'#7a8fb0'};
function $(s,r){return (r||document).querySelector(s)}function $$(s,r){return [].slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function nowIso(){return new Date().toISOString()}
function norm(s){return String(s==null?'':s).replace(/[\uff01-\uff5e]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xfee0)}).replace(/一/g,'ㄧ').replace(/\s+/g,'').replace(/[。．.，,、！!？?；;：:「」『』"'()（）]/g,'').toLowerCase()}
var PUN=/[\s，。、；：！？「」『』（）《》〈〉…—．,.;:!?()]/;
function grade(q,v){v=v||{};var s=v.s||{},self=v.self||{},pos={},sum=0,res=q.errors.map(function(e){pos[e.i]=1;var f=(e.i in s),r=f&&norm(s[e.i])===norm(e.right),sa=f&&!r&&!!self[e.i];var c=r||sa?1:f?0.5:0;sum+=c;return {e:e,found:f,right:r,self:sa,credit:c,yours:f?s[e.i]:''}});
 var fal=Object.keys(s).filter(function(k){return !pos[k]});var frac=Math.max(0,(sum-0.5*fal.length)/q.errors.length);return {res:res,fal:fal,frac:frac,full:frac===1&&!fal.length}}
function answeredQ(q,v){return q.type==='passage'?!!(v&&v.s&&Object.keys(v.s).length):(v!==''&&v!=null)}
function dayScore(st){if(st.sections&&st.sections[0]&&st.sections[0].w){var T=0;st.sections.forEach(function(s){var n=s.ids.length;if(!n)return;s.ids.forEach(function(id){var q=BY[id];T+=(q.type==='passage'?grade(q,st.first[id]).frac:isRight(q,st.first[id])?1:0)*s.w/n})});return Math.round(T)}
 var np=st.ids.filter(function(id){return BY[id].type==='passage'}).length,no=st.ids.length-np,t=0;
 st.ids.forEach(function(id){var q=BY[id];if(q.type==='passage')t+=grade(q,st.first[id]).frac*40/np;else if(isRight(q,st.first[id]))t+=60/no});return Math.round(t)}
function weakAdd(q,v){var w=LS.get(K.weak,{}),cs='';if(q.type==='passage'){grade(q,v).res.forEach(function(r){if(r.credit<1)cs+=r.e.right+r.e.wrong})}
 else if(q.type==='fill')cs=q.answer.join('');else{var m=(q.question+(q.options[q.answer]||'')).match(/「[^」]+」/g);cs=(m||[]).join('')}
 cs.replace(/[\u4e00-\u9fff]/g,function(c){w[c]=(w[c]||0)+1});LS.set(K.weak,w)}
function isRight(q,v){if(q.type==='passage')return grade(q,v).full;if(v==null||v==='')return false;if(q.type==='fill')return q.answer.some(function(a){return norm(a)===norm(v)});return +v===q.answer}
function ansText(q){return q.type==='fill'?q.answer[0]:String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]}
function yourText(q,v){if(v==null||v==='')return '（未作答）';return q.type==='fill'?v:String.fromCharCode(65+(+v))+'. '+q.options[+v]}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},1800)}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}

/* ---- 今日 30 題：優先沒做過，其次最少做過 ---- */
var DAYS=22,PSTART='2026-11-04',PEND='2026-11-25',MINS=[8,5,10],CAPS=[23,5,12],WTS=[24,40,36];
function drawable(p,q){return p[1].indexOf(q.topic)>=0&&(p[1][0]==='改錯')===(q.type==='passage')}
var POOL=QS.filter(function(q){return PLAN.some(function(p){return drawable(p,q)})});
function dnum(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function addD(a,n){var d=new Date(a+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function planStart(){return PSTART}
function ensureStart(){var pl=LS.get(K.plan,null);if(!pl||pl.startDate!==PSTART||pl.endDate!==PEND)LS.set(K.plan,{startDate:PSTART,endDate:PEND,days:DAYS,set_at:nowIso(),prev:pl||null})}
ensureStart();
function dayN(d){return dnum(PSTART,d)+1}
function pickDay(date){var prog=LS.get(K.prog,{}),r=rng(hash(date)),used={},ids=[],sections=[];
 var weak=LS.get(K.weak,{}),n0=dayN(date),left=n0<1?DAYS:Math.max(1,DAYS-n0+1);
 PLAN.forEach(function(p,pi){var pool=QS.filter(function(q){return drawable(p,q)});
  var unseen=pool.filter(function(q){return !(prog[q.id]||{}).seen}).length,need=n0>DAYS?[20,5,12][pi]:Math.min(CAPS[pi],Math.max(MINS[pi],Math.ceil(unseen/left)));if(pi===1)need=5;
  var wrongs=pool.filter(function(q){var g=prog[q.id];return g&&g.seen&&g.lastOk===false&&g.last!==date}).map(function(q){return q.id}).slice(0,pi===1?1:3);
  pool.forEach(function(q){q._r=r();q._w=q.type==='passage'?q.errors.filter(function(e){return weak[e.right]||weak[e.wrong]}).length:0});
  pool.sort(function(a,b){var sa=(prog[a.id]||{}).seen||0,sb=(prog[b.id]||{}).seen||0;return sa-sb||b._w-a._w||a._r-b._r});
  var take=[];wrongs.forEach(function(id){take.push(id);used[id]=1});for(var i=0;i<pool.length&&take.length<need;i++){var q=pool[i];if(used[q.id])continue;take.push(q.id);used[q.id]=1}
  for(i=0;i<pool.length&&take.length<need;i++){if(!used[pool[i].id]){take.push(pool[i].id);used[pool[i].id]=1}}
  sections.push({name:p[0],ids:take,w:WTS[pi]});ids=ids.concat(take)});
 return {date:date,day:dayN(date),trial:dayN(date)<1,sections:sections,ids:ids,cur:{},first:null,rounds:[],submitted:false,done:false,started:false,created_at:nowIso()}}
function getDay(){var days=LS.get(K.days,{}),d=today();if(!days[d]){days[d]=pickDay(d);LS.set(K.days,days)}return days[d]}
function saveDay(st){var days=LS.get(K.days,{});days[st.date]=st;LS.set(K.days,days)}

/* ---- 錯題本相容格式（模擬原 App roby-wrongbook 的欄位）---- */
function wbAdd(st,q,v){var a=LS.get(K.wrong,[]),key='chinese|'+st.date+'|cr-'+q.id;a=a.filter(function(x){return x.key!==key});
 if(q.type==='passage'){var g=grade(q,v),lab={1:'找到且寫對',0.5:'找到但寫錯',0:'沒找到'};
  a.unshift({key:key,subject:'chinese',date:st.date,id:'cr-'+q.id,title:'八上二段國文複習',question:q.text,answer:q.errors.map(function(e){return e.wrong+'→'+e.right+'（'+e.word+'）'}).join('、'),
   yours:g.res.map(function(r){return r.e.wrong+'：'+(r.self?'自評寫對（'+r.yours+'）':lab[r.credit]+(r.found&&!r.right?'（寫成'+(r.yours||'空白')+'）':''))}).join('；')+(g.fal.length?'；點錯 '+g.fal.map(function(k){return '「'+q.text[k]+'」'}).join(''):''),
   explanation:q.explanation,added_at:nowIso(),fixed:false,topic:'改錯',lesson:q.lesson,origin:'chinese-review',qid:q.id,
   words:g.res.filter(function(r){return r.credit<1||r.self}).map(function(r){return {wrong:r.e.wrong,right:r.e.right,word:r.e.word,status:r.self?'self':r.found?'half':'missed'}}),false_clicks:g.fal.map(function(k){return q.text[k]})});LS.set(K.wrong,a);return}
 a.unshift({key:key,subject:'chinese',date:st.date,id:'cr-'+q.id,title:'八上二段國文複習',question:(q.passage?q.passage.slice(0,60)+'…\n':'')+q.question,options:q.options,answer:ansText(q),yours:yourText(q,v),explanation:q.explanation,added_at:nowIso(),fixed:false,topic:q.topic,lesson:q.lesson,origin:'chinese-review',qid:q.id});LS.set(K.wrong,a)}
function wbFix(st,id){var a=LS.get(K.wrong,[]);a.forEach(function(x){if(x.key==='chinese|'+st.date+'|cr-'+id){x.fixed=true;x.fixed_at=nowIso()}});LS.set(K.wrong,a)}
function wbFixLater(qid){var a=LS.get(K.wrong,[]),ch=0;a.forEach(function(x){if(x.qid===qid&&!x.fixed){x.fixed=true;x.fixed_at=nowIso();ch=1}});if(ch)LS.set(K.wrong,a)}

function stats(){var prog=LS.get(K.prog,{}),st=getDay();$('#sTotal').textContent=QS.length;$('#sSeen').textContent=Object.keys(prog).filter(function(k){return BY[k]}).length;
 $('#sToday').textContent=st.first?st.ids.length:Object.keys(st.f1||{}).length;
 $('#wbBadge').textContent=LS.get(K.wrong,[]).filter(function(x){return !x.fixed&&x.origin==='chinese-review'}).length}
function cls(s){return s>=90?'s-g':s>=70?'s-b':'s-r'}
var tab='today';
function render(){$$('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});var v=$('#view');if(EMB)v.style.minHeight=v.offsetHeight+'px';v.innerHTML='';({today:todayView,wrong:wrongView,log:logView})[tab](v);stats();if(EMB)setTimeout(function(){v.style.minHeight=''},60)}
