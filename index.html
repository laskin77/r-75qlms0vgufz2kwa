<button id="save" onclick="save()">完成並存成圖片</button></div>
<script>
const cs=[...document.querySelectorAll('canvas')];
cs.forEach(c=>{const r=devicePixelRatio||1;const w=c.clientWidth||600,h=c.clientHeight||150;c.width=w*r;c.height=h*r;
const x=c.getContext('2d');x.scale(r,r);x.lineWidth=2.5;x.lineCap='round';x.strokeStyle='#123';let d=false;
const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
c.onpointerdown=e=>{d=true;x.beginPath();x.moveTo(...p(e))};
c.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke()}};
c.onpointerup=c.onpointerleave=()=>d=false;});
function clr(i){const c=cs[i];c.getContext('2d').clearRect(0,0,c.width,c.height)}
function save(){const items=[...document.querySelectorAll('label')].map(l=>(l.querySelector('input').checked?'☑ ':'☐ ')+l.innerText);
const W=800,H=300+items.length*44+200,o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');
x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#222';x.font='bold 34px sans-serif';x.fillText('Roby 今日檢查 10/21（週三）',30,60);
x.font='26px sans-serif';let y=120;items.forEach(t=>{x.fillText(t,30,y);y+=44});
const n=document.querySelector('textarea').value;if(n){x.fillText('備註：'+n,30,y);y+=50}
['家長'].forEach((k,i)=>{x.fillText(k+'簽名：',30,y+30);x.drawImage(cs[i],180,y,560,160);y+=200});
const url=o.toDataURL('image/png');
o.toBlob(async b=>{const f=new File([b],'Roby檢查_1021.png',{type:'image/png'});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Roby檢查 10/21'});return}catch(e){}}
showImg(url)},'image/png');}
function showImg(url){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000c;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px';
d.innerHTML='<p style="color:#fff;font-size:18px;text-align:center">長按下方圖片，選「加入照片」或「儲存影像」</p><img src="'+url+'" style="max-width:100%;max-height:75vh;background:#fff;border-radius:8px"><button style="margin-top:14px;font-size:17px;padding:10px 24px">關閉</button>';
d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d);}
</script><script>
(function(){var K='roby-check-'+'2026-10-21';var els=[...document.querySelectorAll('input[type=checkbox],textarea')];
var s={};try{s=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
els.forEach(function(e,i){if(i in s){if(e.type=='checkbox')e.checked=s[i];else e.value=s[i];}
e.addEventListener(e.type=='checkbox'?'change':'input',function(){var o={};els.forEach(function(x,j){o[j]=x.type=='checkbox'?x.checked:x.value});localStorage.setItem(K,JSON.stringify(o));});});})();
</script></body></html>
