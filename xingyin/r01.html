<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="形音義第一回">
<title>必考形音義辨正　第一回</title>
<style>
:root{
  --ink:#1c2430; --muted:#5b6573; --line:#d7ddd6; --paper:#f7f4ee;
  --card:#fffefb; --teal:#1f6f64; --teal-d:#164e47; --teal-s:#e6f3f0;
  --gold:#b8860b; --wrong:#9b2c2c; --wrong-s:#fdecec; --ok:#1f6f3a; --ok-s:#e8f6ec;
  --shadow:0 8px 28px rgba(28,36,48,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:"Iwanami Mincho","Noto Serif CJK TC","Source Han Serif TC","Noto Serif TC","PMingLiU","Songti TC",serif;
  font-size:18px;line-height:1.7;}

.zy,.bopo,.char-hero .zy,.wrong-item,.ans-line{
  font-family:"Noto Sans CJK TC","Noto Sans TC","Source Han Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
}
.char-hero .zy{letter-spacing:.12em;font-weight:500;}
button,input,select{font-family:"Noto Sans CJK TC","Source Han Sans TC","Noto Sans TC","PingFang TC","Heiti TC",sans-serif;}
body{min-height:100dvh;padding-bottom:96px;}
header.app{
  position:sticky;top:0;z-index:20;background:rgba(247,244,238,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:10px 16px 8px;}
header.app h1{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:.06em;}
header.app .sub{color:var(--muted);font-size:.82rem;}
nav.steps{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
nav.steps button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:.8rem;color:var(--muted);}
nav.steps button.on{background:var(--teal);color:#fff;border-color:var(--teal);}
main{max-width:820px;margin:0 auto;padding:16px 16px 40px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px 16px;margin:0 0 16px;}
.sec-title{font-size:1.05rem;color:var(--teal-d);margin:0 0 8px;letter-spacing:.08em;}
.instr{color:var(--muted);font-size:.92rem;margin:0 0 12px;}
.char-hero{display:flex;align-items:flex-end;gap:14px;margin-bottom:8px;}
.char-hero .ch{font-size:3.4rem;line-height:1;font-weight:700;}
.char-hero .zy{font-size:1.25rem;color:var(--teal);letter-spacing:.1em;}
.def{margin:4px 0;}
.ex-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0;font-size:1.05rem;}
.blank{display:inline-flex;align-items:center;justify-content:center;
  width:2.6em;min-width:2.6em;max-width:2.6em;flex:0 0 2.6em;height:2.2em;padding:0 4px;border:none;border-bottom:2px solid var(--teal);
  background:var(--teal-s);border-radius:6px 6px 0 0;font-size:1.15rem;text-align:center;color:var(--ink);}
.blank:focus{outline:2px solid var(--teal);}
.note{font-size:.82rem;color:var(--muted);}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.btn{appearance:none;border:none;border-radius:12px;padding:10px 16px;font-size:1rem;cursor:pointer;}
.btn.primary{background:var(--teal);color:#fff;}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn.warn{background:var(--wrong);color:#fff;}
.item{padding:12px 0;border-top:1px dashed var(--line);}
.item:first-child{border-top:none;}
.qnum{display:inline-block;min-width:1.8em;color:var(--teal-d);font-weight:700;}
.stem{margin:0 0 8px;}
.quotes{color:var(--teal-d);}
.zy-in{width:6.2em;min-width:6.2em;max-width:7.5em;flex:0 0 6.2em;margin:0 6px 6px 0;font-family:"Noto Sans CJK TC","Noto Sans TC","Source Han Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;}
.gz-in{width:2.6em;margin:0 6px 6px 0;font-size:1.2rem;}
.gc-in{width:2.6em;font-size:1.2rem;}
.opts{display:grid;gap:8px;}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;cursor:pointer;text-align:left;}
.opt input{margin-top:.45em;}
.opt.on{border-color:var(--teal);background:var(--teal-s);}
.codes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;background:var(--teal-s);border-radius:12px;padding:8px 10px;margin-bottom:12px;position:sticky;top:108px;z-index:5;font-size:.9rem;}
.codes span{font-size:.95rem;}
.codes b{color:var(--teal-d);}
.letters{display:flex;flex-wrap:wrap;gap:6px;}
.letters button{width:2.2em;height:2.2em;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;}
.letters button.sel{background:var(--teal);color:#fff;border-color:var(--teal);}
.pass{background:#eef5f3;border-radius:12px;padding:12px 14px;margin:0 0 12px;text-align:justify;}
.pass h3{margin:0 0 6px;font-size:.95rem;color:var(--teal-d);}
table.gc10{width:100%;border-collapse:collapse;font-size:.95rem;}
table.gc10 th,table.gc10 td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center;}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(255,254,251,.96);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:30;}
.foot .score{font-size:.95rem;}
.ok{color:var(--ok)} .bad{color:var(--wrong)}
.badge{display:inline-block;border-radius:999px;padding:0 8px;font-size:.75rem;margin-left:6px;}
.badge.ok{background:var(--ok-s);color:var(--ok)}
.badge.bad{background:var(--wrong-s);color:var(--wrong)}
.result-box{font-size:1.6rem;text-align:center;padding:12px 0;}
.wrong-item{background:var(--wrong-s);border-radius:12px;padding:10px 12px;margin:8px 0;}
.ans-line{margin-top:4px;}
.study-box{background:var(--teal-s);border-radius:12px;padding:10px 12px;margin:8px 0;}
.progress{height:6px;background:#e4e8e3;border-radius:99px;overflow:hidden;margin:8px 0 0;}
.progress>i{display:block;height:100%;background:var(--teal);width:0;}
.hint{font-size:.8rem;color:var(--muted);margin:0 0 10px;}
.marked.ok .blank,.item.ok{/* noop */}
@media (max-width:520px){
  body{font-size:17px;}
  .char-hero .ch{font-size:2.8rem;}
  .codes{grid-template-columns:repeat(2,1fr);top:86px;}
}
</style>
</head>

<header class="app">
  <h1>必考形音義辨正　第一回</h1>
  <div class="sub">捷英社　一日一回　題目照原書　題組不拆開</div>
  <nav class="steps" id="steps"></nav>
</header>
<main id="main"></main>
<footer class="foot" id="foot"></footer>

const STORE = "roby-xyy-r01";

function load(){
  try{ return JSON.parse(localStorage.getItem(STORE) || "{}"); }catch(e){ return {}; }
}
function save(state){
  localStorage.setItem(STORE, JSON.stringify(state));
}
let S = Object.assign({
  view:"warmup", card:0, seenStudy:{}, answers:{}, graded:false, grade:null
}, load());

function normZY(s){
  s = String(s||"").trim().replace(/\s+/g,"");
  s = s.replace(/一/g,"ㄧ");
  s = s.replace(/[′´'’]/g,"ˊ").replace(/[ˇ̌]/g,"ˇ").replace(/[ˋ`｀]/g,"ˋ").replace(/[˙•・‧]/g,"˙");
  s = s.replace(/2/g,"ˊ").replace(/3/g,"ˇ").replace(/4/g,"ˋ").replace(/5/g,"˙").replace(/1/g,"");
  return s;
}
function zyEq(a,b){ return normZY(a)===normZY(b); }
function chEq(a,b){ return String(a||"").trim()===String(b||"").trim(); }
function getA(id){ return (S.answers[id]||[]); }
function setA(id, idx, val){
  const arr = getA(id).slice();
  arr[idx]=val;
  S.answers[id]=arr;
  S.graded=false;
  save(S);
  updateFoot();
}

function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function renderBlanks(pattern, id, answers, kind){
  // split on （　） fullwidth blanks
  const parts = String(pattern).split("（　）");
  let html="";
  const n = parts.length-1;
  parts.forEach((p,i)=>{
    html += esc(p);
    if(i<n){
      const cls = kind==="zy"?"blank zy-in":(kind==="gz"?"blank gz-in":"blank");
      const v = esc(getA(id)[i]||"");
      html += `<input class="${cls}" data-id="${esc(id)}" data-i="${i}" value="${v}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    }
  });
  return html;
}

function bindBlanks(root){
  root.querySelectorAll("input.blank").forEach(inp=>{
    inp.addEventListener("input", ev=>{
      setA(ev.target.dataset.id, +ev.target.dataset.i, ev.target.value);
    });
  });
}

function warmupCard(){
  const cards = DATA.warmup.cards;
  const i = Math.max(0, Math.min(S.card, cards.length-1));
  S.card=i;
  const c = cards[i];
  const zy = Array.isArray(c.zhuyin)? c.zhuyin.join("／"): c.zhuyin;
  let body="";
  if(c.type==="study"){
    (c.readings||[{zhuyin:c.zhuyin,defs:c.defs,examples:c.examples}]).forEach(rd=>{
      body += `<div class="study-box"><div><b>${esc(rd.zhuyin)}</b></div>`;
      (rd.defs||[]).forEach(d=> body += `<div class="def">${esc(d)}</div>`);
      (rd.examples||[]).forEach(ex=>{
        const t = ex.pattern||ex;
        body += `<div class="ex-row">例：${esc(typeof t==="string"?t:t)}${ex.note?`<span class="note">（${esc(ex.note)}）</span>`:""}</div>`;
      });
      body += `</div>`;
    });
    if(!c.readings && c.examples){
      // already handled if readings missing - 慟
    }
    body += `<p class="hint">這張是多音字或已填好的例詞，請先看過，不必填空。</p>`;
  }else{
    c.defs.forEach((d,di)=>{
      body += `<div class="def">${c.defs.length>1?`<b>${di+1}. </b>`:""}${esc(d)}</div>`;
    });
    const groups={};
    c.examples.forEach((ex,ei)=>{
      const k = (ex.sense??"all");
      (groups[k]||=[]).push({ex,ei});
    });
    // render in order
    let blankIndex=0;
    // We need a consistent id per blank across the card. Use running index into answers array.
    // Rebuild pattern list in order
    body += `<div style="margin-top:8px">`;
    let cursor=0;
    c.examples.forEach((ex,ei)=>{
      const id = c.id;
      // temporarily map this example's answers to a slice starting at cursor
      const n = (ex.answers||[]).length;
      // custom render: replace blanks with inputs bound to cursor..
      const parts = String(ex.pattern).split("（　）");
      let html="例：";
      parts.forEach((p,pi)=>{
        html += esc(p);
        if(pi<parts.length-1){
          const v = esc(getA(id)[cursor]||"");
          html += `<input class="blank" data-id="${esc(id)}" data-i="${cursor}" value="${v}" autocomplete="off" spellcheck="false">`;
          cursor++;
        }
      });
      if(ex.note) html += `<span class="note">（${esc(ex.note)}）</span>`;
      body += `<div class="ex-row">${html}</div>`;
    });
    body += `</div>`;
  }
  const pct = Math.round((i)/(cards.length-1)*100);
  return `<section class="card" id="warmup">
    <div class="sec-title">基礎練習　字卡暖身　${i+1}／${cards.length}</div>
    <div class="progress"><i style="width:${(i+1)/cards.length*100}%"></i></div>
    <div class="char-hero"><div class="ch">${esc(c.char)}</div><div class="zy">${esc(zy||"")}</div></div>
    ${body}
    <div class="rowbtns">
      <button class="btn ghost" id="prevCard" ${i===0?"disabled":""}>上一張</button>
      <button class="btn primary" id="nextCard">${i===cards.length-1?"進入進階練習":"下一張"}</button>
      <button class="btn ghost" id="skipWarm">略過暖身</button>
    </div>
  </section>`;
}

function qStem(stem){
  return esc(stem).replace(/「/g,'<span class="quotes">「').replace(/」/g,'」</span>');
}

function sectionZhiyin(){
  const sec = DATA.advanced.zhiyin;
  let h = `<section class="card" id="sec-zy"><div class="sec-title">${esc(sec.title)}</div>
    <p class="instr">${esc(sec.instruction||"")}　請把引號裡的字寫成注音。聲調可用 ˊˇˋ，或寫 2、3、4；空白不計。</p>`;
  sec.items.forEach(it=>{
    const a=getA(it.id);
    h += `<div class="item"><span class="qnum">${it.n}.</span> <span class="stem">${qStem(it.stem)}</span><div>`;
    it.targets.forEach((t,i)=>{
      h += `<label>${esc(t)} <input class="blank zy-in" data-id="${it.id}" data-i="${i}" value="${esc(a[i]||"")}" autocomplete="off" spellcheck="false" placeholder="注音"></label> `;
    });
    h += `</div></div>`;
  });
  return h+`</section>`;
}

function sectionGuozi(){
  const sec = DATA.advanced.guozi;
  let h = `<section class="card" id="sec-gz"><div class="sec-title">${esc(sec.title)}</div>
    <p class="instr">請把注音寫成國字。一格一字。</p>`;
  sec.items.forEach(it=>{
    const a=getA(it.id);
    // replace 「注音」 with input. May be one or two zhuyin in one quote pair, or two separate quotes.
    // Simpler: show stem and N inputs below, plus highlight quotes.
    h += `<div class="item"><span class="qnum">${it.n}.</span> <span class="stem">${qStem(it.stem)}</span><div>`;
    it.answers.forEach((_,i)=>{
      h += `<input class="blank gz-in" data-id="${it.id}" data-i="${i}" value="${esc(a[i]||"")}" autocomplete="off" spellcheck="false">`;
    });
    h += `</div></div>`;
  });
  return h+`</section>`;
}

  const sec = DATA.advanced.gaicuo_passages;
  let h = `<section class="card" id="sec-gcp"><div class="sec-title">${esc(sec.title)}</div>
    <p class="instr">兩篇短文為同一題組，請找出十個錯別字。一格一個錯字、一個正字。</p>`;
  sec.passages.forEach(p=>{
    h += `<div class="pass"><h3>短文${p.n}</h3><div>${esc(p.text)}</div></div>`;

  h += `<table class="gc10"><thead><tr><th>題號</th><th>錯字</th><th>正字</th></tr></thead><tbody>`;
  sec.items.forEach(it=>{
    const id = sec.id+"-"+it.n;
    const a=getA(id);
    h += `<tr><td>${it.n}</td>
      <td><input class="blank gc-in" data-id="${id}" data-i="0" value="${esc(a[0]||"")}"></td>
      <td><input class="blank gc-in" data-id="${id}" data-i="1" value="${esc(a[1]||"")}"></td></tr>`;
  });
  h += `</tbody></table></section>`;
  return h;
}

function sectionPeidui(p){
  let h = `<section class="card" id="${p.id}"><div class="sec-title">${esc(p.title)}</div>
    <div class="codes">`;
  p.codes.forEach(([k,v])=>{ h += `<span><b>${k}</b>　${esc(v)}</span>`; });
  h += `</div>`;
  p.items.forEach(it=>{
    const id=p.id+"-"+it.n;
    const sel=(getA(id)[0]||"");
    h += `<div class="item"><span class="qnum">${it.n}.</span> <span class="stem">${esc(it.stem)}</span>
      <div class="letters" data-id="${id}">`;
    "ABCDEFGHIJKL".split("").forEach(L=>{
      h += `<button type="button" data-l="${L}" class="${sel===L?"sel":""}">${L}</button>`;
    });
    h += `</div></div>`;
  });
  return h+`</section>`;
}

function sectionXuanze(){
  const sec = DATA.advanced.xuanze;
  let h = `<section class="card" id="sec-xz"><div class="sec-title">${esc(sec.title)}</div>`;
  sec.items.forEach(it=>{
    const sel=getA(it.id)[0]||"";
    h += `<div class="item"><div class="stem"><span class="qnum">${it.n}.</span> ${qStem(it.stem)}</div><div class="opts">`;
    Object.keys(it.options).forEach(k=>{
      const on = sel===k?"on":"";
      h += `<label class="opt ${on}"><input type="radio" name="${it.id}" value="${k}" ${sel===k?"checked":""}> <span>(${k}) ${esc(it.options[k])}</span></label>`;
    });
    h += `</div></div>`;
  });
  return h+`</section>`;
}

function advancedHTML(){
  const pds = DATA.advanced.peidui.map(sectionPeidui).join("");
  return sectionZhiyin()+sectionGuozi()+sectionGcShort()+sectionGcPass()+pds+sectionXuanze();
}

function countAdvancedFilled(){
  let n=0, total=100;
  DATA.advanced.zhiyin.items.forEach(it=>{
    it.answers.forEach((_,i)=>{ if((getA(it.id)[i]||"").trim()) n++; });
  });
  DATA.advanced.guozi.items.forEach(it=>{
    it.answers.forEach((_,i)=>{ if((getA(it.id)[i]||"").trim()) n++; });
  });
  DATA.advanced.gaicuo_short.items.forEach(it=>{
    const a=getA(it.id);
    if((a[0]||"").trim() && (a[1]||"").trim()) n++;
  });
  DATA.advanced.gaicuo_passages.items.forEach(it=>{
    const a=getA(DATA.advanced.gaicuo_passages.id+"-"+it.n);
    if((a[0]||"").trim() && (a[1]||"").trim()) n++;
  });
  DATA.advanced.peidui.forEach(p=>{
    p.items.forEach(it=>{ if((getA(p.id+"-"+it.n)[0]||"").trim()) n++; });
  });
  DATA.advanced.xuanze.items.forEach(it=>{ if((getA(it.id)[0]||"").trim()) n++; });
  return {n,total};
}

function gzMatch(it, given){
  const alts = [it.answers].concat(it.alt_answers||[]);
  return alts.some(ans => ans.every((ch,i)=> chEq(given[i], ch)));
}

function gradeAll(){
  const wrong=[];
  let zy=0,gz=0,gcs=0,gcp=0,pd=0,xz=0;
  let wy=0,wg=0,wgc=0,wp=0; // warmup not in 100

  DATA.advanced.zhiyin.items.forEach(it=>{
    const a=getA(it.id);
    let ok=true;
    it.answers.forEach((ans,i)=>{
      const good=zyEq(a[i], ans);
      if(good) zy++; else ok=false;
    });
    if(!ok) wrong.push({sec:"字音", n:it.n, stem:it.stem, got:a, ans:it.answers, kind:"zy", targets:it.targets});
  });
  DATA.advanced.guozi.items.forEach(it=>{
    const a=getA(it.id);
    if(gzMatch(it,a)){ gz += it.answers.length; }
    else {
      it.answers.forEach((ans,i)=>{ if(chEq(a[i], ans) || (it.alt_answers||[]).some(al=>chEq(a[i], al[i]))) gz++; });
      wrong.push({sec:"國字", n:it.n, stem:it.stem, got:a, ans:it.answers, alt:it.alt_answers, kind:"gz"});
    }
  });
  DATA.advanced.gaicuo_short.items.forEach(it=>{
    const a=getA(it.id);
    const ok = chEq(a[0], it.wrong) && chEq(a[1], it.correct);
    if(ok) gcs++; else wrong.push({sec:"改錯短句", n:it.n, stem:it.stem, got:a, ans:[it.wrong,it.correct], kind:"gc"});
  });
  const gp=DATA.advanced.gaicuo_passages;
  gp.items.forEach(it=>{
    const a=getA(gp.id+"-"+it.n);
    const ok = chEq(a[0], it.wrong) && chEq(a[1], it.correct);
    if(ok) gcp++; else wrong.push({sec:"改錯短文", n:it.n, stem:"（短文）"+it.in, got:a, ans:[it.wrong,it.correct], kind:"gc"});
  });
  DATA.advanced.peidui.forEach((p,pi)=>{
    p.items.forEach(it=>{
      const a=getA(p.id+"-"+it.n);
      const ok = chEq(a[0], it.answer);
      if(ok) pd++; else wrong.push({sec:"配對"+(pi+1), n:it.n, stem:it.stem, got:a, ans:[it.answer], kind:"pd"});
    });
  });
  DATA.advanced.xuanze.items.forEach(it=>{
    const a=getA(it.id);
    const ok = chEq(a[0], it.answer);
    if(ok) xz++; else wrong.push({sec:"選擇", n:it.n, stem:it.stem, got:a, ans:[it.answer], options:it.options, kind:"xz"});
  });

  // warmup score (informational)
  let wOk=0,wTot=0;
  DATA.warmup.cards.forEach(c=>{
    if(c.type!=="fill") return;
    const a=getA(c.id);
    let k=0;
    c.examples.forEach(ex=>{
      (ex.answers||[]).forEach(ans=>{
        wTot++;
        if(chEq(a[k], ans)) wOk++;
        k++;
      });
    });
  });

  const total = zy+gz+gcs+gcp+pd+xz;
  return {
    total, max:100, parts:{字音:zy,國字:gz,改錯短句:gcs,改錯短文:gcp,配對:pd,選擇:xz},
    partMax:{字音:20,國字:20,改錯短句:8,改錯短文:10,配對:24,選擇:18},
    warmup:{ok:wOk,total:wTot},
    wrong
  };
}

function resultHTML(g){
  let parts="";
  Object.keys(g.parts).forEach(k=>{
    parts += `<div>${esc(k)}　${g.parts[k]}／${g.partMax[k]}</div>`;
  });
  let wr="";
  if(!g.wrong.length) wr=`<p class="ok">全部答對，太好了。</p>`;
  g.wrong.forEach(w=>{
    let got="", ans="";
    if(w.kind==="zy"){
      got = (w.targets||[]).map((t,i)=>`${t} ${w.got[i]||"（空）"}`).join("　");
      ans = (w.targets||[]).map((t,i)=>`${t} ${w.ans[i]}`).join("　");
    }else if(w.kind==="gz"){
      got = (w.got||[]).map(x=>x||"（空）").join("、");
      ans = w.ans.join("、") + (w.alt? "（或 "+w.alt.map(a=>a.join("、")).join("／")+"）":"");
    }else if(w.kind==="gc"){
      got = `錯字 ${w.got[0]||"（空）"}　正字 ${w.got[1]||"（空）"}`;
      ans = `錯字 ${w.ans[0]}　正字 ${w.ans[1]}`;
    }else if(w.kind==="pd"){
      got = w.got[0]||"（空）";
      ans = w.ans[0];
    }else if(w.kind==="xz"){
      got = w.got[0]?`(${w.got[0]}) ${w.options[w.got[0]]||""}`:"（未作）";
      ans = `(${w.ans[0]}) ${w.options[w.ans[0]]}`;
    }
    wr += `<div class="wrong-item"><div><b>${esc(w.sec)} ${w.n}.</b> ${qStem(w.stem)}</div>
      <div class="ans-line bad">你的作答：${esc(got)}</div>
      <div class="ans-line ok">正確答案：${esc(ans)}</div></div>`;
  });
  return `<section class="card" id="result">
    <div class="sec-title">交卷結果　第一回</div>
    <div class="result-box">進階練習　${g.total}／100</div>
    <div class="instr" style="text-align:center">${parts}</div>
    <p class="instr" style="text-align:center">字卡暖身　${g.warmup.ok}／${g.warmup.total}（不計入一百分）</p>
    <h3>錯題 ${g.wrong.length} 題</h3>
    ${wr}
    <div class="rowbtns">
      <button class="btn primary" id="backEdit">回到題目更改</button>
      <button class="btn ghost" id="retryWrong">只重看錯題（題目仍保留）</button>
    </div>
  </section>`;
}

function updateFoot(){
  const el=document.getElementById("foot");
  if(!el) return;
  const f=countAdvancedFilled();
  const g=S.graded?S.grade:null;
  el.innerHTML = `<div class="score">進階已填 ${f.n}／${f.total}${g?`　<span class="${g.total===100?"ok":""}">得分 ${g.total}／100</span>`:""}</div>
    <div class="rowbtns" style="margin:0">
      <button class="btn ghost" id="saveBtn">已自動儲存</button>
      <button class="btn primary" id="submitBtn">${S.graded?"再看成績":"交卷"}</button>
    </div>`;
  document.getElementById("submitBtn").onclick=onSubmit;
}

function onSubmit(){
  const g=gradeAll();
  S.graded=true; S.grade=g; S.view="result"; save(S);
  render();
  const r=document.getElementById("result");
  if(r) r.scrollIntoView({behavior:"smooth",block:"start"});
}

function wireAdvanced(root){
  bindBlanks(root);
  root.querySelectorAll(".letters").forEach(box=>{
    box.addEventListener("click", ev=>{
      const b=ev.target.closest("button[data-l]");
      if(!b) return;
      const id=box.dataset.id;
      const cur=getA(id)[0];
      const next = cur===b.dataset.l? "": b.dataset.l;
      setA(id,0,next);
      box.querySelectorAll("button").forEach(x=>x.classList.toggle("sel", x.dataset.l===next && next));
    });
  });
  root.querySelectorAll(".opt input[type=radio]").forEach(inp=>{
    inp.addEventListener("change", ev=>{
      setA(ev.target.name, 0, ev.target.value);
      ev.target.closest(".item").querySelectorAll(".opt").forEach(o=>o.classList.remove("on"));
      ev.target.closest(".opt").classList.add("on");
    });
  });
}

function render(){
  const main=document.getElementById("main");
  const nav=document.getElementById("steps");
  nav.innerHTML="";
  [["warmup","字卡暖身"],["advanced","進階練習"],["result","成績"]].forEach(([v,lab])=>{
    const b=document.createElement("button");
    b.textContent=lab;
    if(S.view===v) b.classList.add("on");
    if(v==="result" && !S.graded) b.disabled=true;
    b.onclick=()=>{ S.view=v; save(S); render(); window.scrollTo(0,0); };
    nav.appendChild(b);
  });

  if(S.view==="warmup"){
    main.innerHTML = warmupCard();
    bindBlanks(main);
    document.getElementById("prevCard").onclick=()=>{ S.card=Math.max(0,S.card-1); save(S); render(); };
    document.getElementById("nextCard").onclick=()=>{
      if(S.card>=DATA.warmup.cards.length-1){ S.view="advanced"; save(S); render(); window.scrollTo(0,0); }
      else { S.card++; save(S); render(); }
    };
    document.getElementById("skipWarm").onclick=()=>{ S.view="advanced"; save(S); render(); window.scrollTo(0,0); };
  }else if(S.view==="advanced"){
    main.innerHTML = advancedHTML() + (S.graded && S.grade ? resultHTML(S.grade): "");
    wireAdvanced(main);
    if(S.graded){
      const be=document.getElementById("backEdit");
      if(be) be.onclick=()=>{ S.view="advanced"; S.graded=false; save(S); render(); };
      const rw=document.getElementById("retryWrong");
      if(rw) rw.onclick=()=>{ document.getElementById("result").scrollIntoView({behavior:"smooth"}); };
    }
  }else if(S.view==="result"){
    if(!S.grade) S.grade=gradeAll();
    main.innerHTML = resultHTML(S.grade);
    document.getElementById("backEdit").onclick=()=>{ S.view="advanced"; save(S); render(); window.scrollTo(0,0); };
    document.getElementById("retryWrong").onclick=()=>{ S.view="advanced"; save(S); render();
      setTimeout(()=>{ const r=document.getElementById("result"); if(r) r.scrollIntoView({behavior:"smooth"}); },50);
    };
  }
  updateFoot();
}

document.getElementById("steps");
render();

</script>
</body>
</html>
